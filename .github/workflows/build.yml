name: Build Space Player

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name "SpacePlayer" --add-data "backgrounds;backgrounds" main.py
      - name: Zip build
        run: Compress-Archive -Path dist\SpacePlayer.exe -DestinationPath SpacePlayer-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: SpacePlayer-windows
          path: SpacePlayer-windows.zip

  build-macos-arm64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --onefile --windowed --name "SpacePlayer" --add-data "backgrounds:backgrounds" main.py
      - name: Zip build
        run: cd dist && zip -r ../SpacePlayer-mac-arm64.zip SpacePlayer.app
      - uses: actions/upload-artifact@v4
        with:
          name: SpacePlayer-mac-arm64
          path: SpacePlayer-mac-arm64.zip

  release:
    needs: [build-windows, build-macos-arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -name "*.zip" -exec cp {} release-assets/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.zip
